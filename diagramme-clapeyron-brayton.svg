  <text x="184" y="318" font-size="14" font-weight="bold">1</text>
  <text x="36" y="58" font-size="14" font-weight="bold">2</text>
  <text x="138" y="48" font-size="14" font-weight="bold">3</text>
  <text x="486" y="318" font-size="14" font-weight="bold">4</text>
  <text font-size="12" fill="#45566b" dy="-8"><textPath href="#leg12" startOffset="10%">compresseur (adiab. rév.)</textPath></text>
  <text x="140" y="82" font-size="12" fill="#45566b">combustion (isobare)</text>
  <text font-size="12" fill="#45566b" dy="16"><textPath href="#c34" startOffset="12%">turbine (adiab. rév.)</textPath></text>
